name: Update note and publish website

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'tests/**', '.github/workflows/publish.yml']
  schedule:
    - cron: '0 0 * * *' # 09:00 JST; scheduled execution can be delayed by GitHub.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sustella-website-production
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test RSS conversion
        run: python -m unittest discover -s tests -v
      - name: Test article rendering
        run: node tests/note-renderer.cjs
      - name: Refresh latest three articles
        if: github.event_name != 'push'
        run: python scripts/update_note.py
      - name: Commit changed JSON only
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- site/data/note.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/note.json
            git commit -m "Update latest note articles"
            git push origin HEAD:main
          fi
      # A GITHUB_TOKEN commit does not start another push workflow.
      # Publish from this SAME run after committing, so the JSON reaches the live site.
      - name: Verify deployment secrets
        if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Read existing production branch
        id: pages
        if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/cloudflare_branch.py
      - name: Publish static site to existing Cloudflare Pages project
        if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy site --project-name=sustella-home --branch=${{ steps.pages.outputs.branch }}
      - name: Deployment setup pending
        if: vars.ENABLE_CLOUDFLARE_DEPLOY != 'true'
        run: echo "Article JSON is ready. Cloudflare publishing remains disabled until setup is complete."
